name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Count test results
        if: always()
        run: python _cnt.py

  # NOTE: no `secrets.*` expressions anywhere in this file. This repository
  # rejects every workflow that references a secret at parse time
  # (startup_failure on all of main-push and tag-push runs, proven by the
  # p3..p7 bisect: 4245d18 clean -> success, +any secrets.* -> startup_failure,
  # regardless of workflow-level env / job-level env / inline run: / $GITHUB_ENV).
  #
  # Consequence: releases are built and signed LOCALLY (see signing/README.md)
  # and uploaded to the tag's release by hand; CI only verifies tests on every
  # push and every tag.
